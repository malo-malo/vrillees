repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^tailwind/daisyui.*\.mjs$'
      - id: end-of-file-fixer
      - id: check-builtin-literals
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
        exclude: '^helm/.*/templates/.*\.yaml'
      - id: debug-statements
      - id: destroyed-symlinks
      - id: detect-private-key
        exclude: '\.example'
  - repo: local
    hooks:
      - id: helm-lint
        name: Helm lint site chart
        language: system
        entry: helm lint
        args: [helm/site/]
        files: ^helm/site/
        pass_filenames: false
      - id: rustywind
        name: rustywind Tailwind CSS class linter
        language: node
        additional_dependencies:
          - rustywind@0.21.0
        entry: rustywind
        args: [--write]
        files: ^templates
        types_or: [html]
  - repo: https://github.com/gitleaks/gitleaks
    rev: 6eaad039603a4de39fddd1cf5f727391efe9974e  # v8.30.0
    hooks:
      - id: gitleaks
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a27a2e47c7751b639d2b5badf0ef6ff11fee893f  # v0.15.4
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format
  - repo: https://github.com/MarcoGorelli/absolufy-imports
    rev: 2b275ea7e0241bf601527d8378dc68d6e31e03e0  # v0.3.1
    hooks:
      - id: absolufy-imports
  - repo: https://github.com/UnknownPlatypus/djangofmt-pre-commit
    rev: v0.2.12
    hooks:
      - id: djangofmt
  - repo: https://github.com/hadolint/hadolint
    rev: 57e1618d78fd469a92c1e584e8c9313024656623  # v2.14.0
    hooks:
      - id: hadolint-docker
  - repo: https://github.com/asottile/pyupgrade
    rev: 75992aaa40730136014f34227e0135f63fc951b4  # v3.21.2
    hooks:
      - id: pyupgrade
        args: [--py314]
  - repo: https://github.com/adamchainz/django-upgrade
    rev: 1db0cbd209d6c4dc78191593942e6269fae99e8d  # 1.30.0
    hooks:
      - id: django-upgrade
        args: [--target-version, "6.0"]
  - repo: https://github.com/abravalheri/validate-pyproject
    rev: 4b2e70d08cb2ccd26d1fba73588de41c7a5d50b7  # v0.25
    hooks:
      - id: validate-pyproject
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 9257c6050c0261b8c57e712f632dc4a8010109a9  # v1.25.2
    hooks:
      - id: zizmor
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: d0e12caebb2ab0ee8bf98181c8bfe9702bca103d  # v1.105.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate
