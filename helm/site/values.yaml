# Application image - override with the actual image in values.secret.yaml
image: ghcr.io/CHANGE_ME/vrillees_website:main

# Number of webapp replicas - override in values.secret.yaml
replicas: 2

# Redis configuration
redis:
  image: redis:8.2.2-bookworm

# Resource requests/limits - defaults tuned for cx23 (2 vCPU, 4 GB RAM).
# Override per-workload in values.secret.yaml if using a different server type.
resources:
  app:
    requests:
      memory: 1536Mi
      cpu: 700m
    limits:
      memory: 3072Mi
      cpu: 1600m
  worker:
    requests:
      memory: 1536Mi
      cpu: 700m
    limits:
      memory: 3072Mi
      cpu: 1600m
  cronjob:
    requests:
      memory: 512Mi
      cpu: 200m
    limits:
      memory: 1024Mi
      cpu: 800m
  redis:
    requests:
      memory: 64Mi
      cpu: 50m
    limits:
      memory: 256Mi
      cpu: 200m

# Application domain - set in values.secret.yaml
domain: ""

# Django application settings
app:
  adminUrl: admin/
  admins: ""
  allowedHosts: "*"
  contactEmail: ""
  connPool:
    maxIdle: 120
    maxLifetime: 1800
    maxWaiting: 25
    maxSize: 100
    minSize: 2
    timeout: 20
  cspScriptWhitelist: "*.account.google.com,*.googleapis.com,*.cloudflareinsights.com"
  mailgunApiUrl: https://api.eu.mailgun.net/v3
  mailgunSenderDomain: ""
  metaAuthor: ""
  metaDescription: ""
  metaKeywords: ""
  secureSslRedirect: true

# CronJob schedules - customise for your project
cronjobs:
  clear-sessions:
    schedule: "20 5 * * *"
    command: "./manage.sh clearsessions"
  prune-db-task-results:
    schedule: "25 9 * * *"
    command: "./manage.sh prune_db_task_results --min-age-days=1"

# Secrets - never commit values.secret.yaml
# Copy values.secret.yaml.example to values.secret.yaml and fill in values.
secrets:
  djangoSecretKey: ""
  djangoSecretKeyFallbacks: ""
  mailgunApiKey: ""
  redisPassword: ""
  sentryUrl: ""
  openTelemetryUrl: ""
  pwaSha256Fingerprints: ""
  # Object Storage (use_storage=y) - set in values.secret.yaml to enable
  useS3Storage: "false"
  hetznerStorageAccessKey: ""
  hetznerStorageSecretKey: ""
  hetznerStorageBucket: ""
  hetznerStorageEndpoint: ""
  hetznerStorageRegion: "fsn1"
  cloudflare:
    cert: ""
    key: ""
