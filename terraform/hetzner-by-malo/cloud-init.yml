#cloud-config
hostname: ${hostname}
manage_etc_hosts: true

package_update: true
packages:
  - ufw
  - curl
  - ca-certificates
  - apt-transport-https

users:
  - name: malo
    groups: [sudo]
    shell: /bin/bash
    sudo: ALL=(ALL) NOPASSWD:ALL
    ssh_authorized_keys:
      - ${ssh_public_key}

write_files:
  - path: /etc/ssh/sshd_config.d/ssh.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      Port 22
      MaxAuthTries 2
      AuthorizedKeysFile .ssh/authorized_keys
      AllowUsers malo

runcmd:
  - ufw allow 22/tcp comment 'SSH'
  - ufw allow 80/tcp comment 'HTTP'
  - ufw allow 443/tcp comment 'HTTPS'
  - ufw --force enable
  - systemctl restart sshd
