name: vrillees_website:deploy
run-name: ${{ github.actor }} is deploying to production
on:
  workflow_dispatch:
    branches:
      - main
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    permissions:
      contents: read
  build:
    uses: ./.github/workflows/docker.yml
    needs: checks
    permissions:
      attestations: write
      contents: write
      packages: write
      id-token: write
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
    env:
      HELM_RELEASE: site
      HELM_CHART: helm/site
      KUBECONFIG_FILE: vrillees_website.yaml
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          persist-credentials: false
      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d  # v5.1.0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310  # v5.0.1
      - name: Write kubeconfig
        env:
          KUBECONFIG_BASE64: ${{ secrets.KUBECONFIG_BASE64 }}
        run: |
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_BASE64" | base64 -d > "$HOME/.kube/$KUBECONFIG_FILE"
          chmod 600 "$HOME/.kube/$KUBECONFIG_FILE"
      - name: Write Helm secret values
        env:
          HELM_VALUES_SECRET: ${{ secrets.HELM_VALUES_SECRET }}
        run: |
          printf '%s' "$HELM_VALUES_SECRET" > "$HELM_CHART/values.secret.yaml"
          chmod 600 "$HELM_CHART/values.secret.yaml"
      - name: Deploy to Kubernetes
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          helm upgrade --install "$HELM_RELEASE" "$HELM_CHART"/ \
            --kubeconfig "$HOME/.kube/$KUBECONFIG_FILE" \
            --rollback-on-failure \
            --set "image=$IMAGE" \
            -f "$HELM_CHART/values.yaml" \
            -f "$HELM_CHART/values.secret.yaml"
