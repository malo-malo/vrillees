name: vrillees_website:docker
on:
  workflow_call:
    outputs:
      image:
        description: Docker image
        value: ${{ jobs.docker.outputs.image }}
jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: write
      packages: write
      id-token: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    outputs:
      image: ${{ steps.set_image.outputs.image }}
    steps:
      - name: Cloning repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Log in to Github Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c  # v4.2.0
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Attestation is not supported on private user-owned repositories and will fail
      # with "Feature not available for user-owned private repositories." Use
      # continue-on-error so the build succeeds regardless.
      - name: Generate artifact attestation
        continue-on-error: true
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - name: Set image output
        id: set_image
        env:
          SHA: ${{ github.sha }}
        run: echo "image=$REGISTRY/$IMAGE_NAME:$SHA" >> "$GITHUB_OUTPUT"
