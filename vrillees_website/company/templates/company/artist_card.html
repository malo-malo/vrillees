<div class="card bg-primary-content w-96 shadow-sm">
    <figure class="px-10 pt-10">
        <img
            src="{{ artist.picture.url }}"
            alt="Photo de {{ artist.first_name }}"
            class="rounded-xl"
        >
    </figure>
    <div class="card-body items-center text-center">
        <h2 class="card-title">{{ artist.full_name }}</h2>
        <p>Une artiste de qualité</p>
    </div>
</div>
